<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F6F3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pantry">
  <meta name="description" content="Pantry – say an item and a shop, and it is saved under that shop.">
  <title>Pantry</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
  <link rel="stylesheet" href="css/styles.css?v=9">
</head>
<body>
<div id="app">

  <!-- ===================== HOME ===================== -->
  <section id="home" class="screen" aria-label="My Lists">
    <header class="home-header">
      <div class="title-block">
        <p class="subtle" id="summary">Loading…</p>
        <h1>My Lists</h1>
      </div>
      <div class="header-actions">
        <button type="button" class="round-btn" id="btn-search" aria-label="Search all items" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <button type="button" class="shops-pill" id="btn-manage">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v1a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0V9z"/><path d="M5 13v7h14v-7"/><path d="M10 20v-4h4v4"/></svg>
          Shops
        </button>
        <button type="button" class="round-btn cart" id="btn-cart" aria-label="Open cart, all items">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L21 7H6"/></svg>
          <span class="badge" id="cart-count" aria-hidden="true">0</span>
        </button>
      </div>
    </header>

    <div class="search-row" id="search-row" hidden>
      <label for="search-input" class="sr-only">Search all lists</label>
      <div class="field search-field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search-input" type="search" placeholder="Search all lists" autocomplete="off" enterkeyhint="search">
      </div>
      <button type="button" class="round-btn" id="btn-search-close" aria-label="Close search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="split">
      <nav class="rail" id="rail" aria-label="Shops"></nav>
      <main class="items" aria-label="Items">
        <form class="add-box" id="add-form" autocomplete="off">
          <label for="add-input" class="sr-only" id="add-label">Add an item</label>
          <input id="add-input" type="text" placeholder="Add an item…" enterkeyhint="done">
          <button type="submit" class="add-btn" aria-label="Add item">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          </button>
        </form>
        <div id="list"></div>
      </main>
    </div>

    <div class="fade" aria-hidden="true"></div>
    <button type="button" class="mic-fab" id="btn-mic" aria-label="Speak an item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
    </button>
  </section>

  <!-- ===================== CART ===================== -->
  <section id="cart" class="screen" aria-label="Cart" hidden>
    <header class="cart-header">
      <button type="button" class="round-btn back" id="btn-cart-back" aria-label="Back to lists">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="title-block">
        <h1>Cart</h1>
        <p class="subtle" id="cart-summary">0 items</p>
      </div>
      <span class="round-btn cart big" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L21 7H6"/></svg>
        <span class="badge" id="cart-count-2">0</span>
      </span>
    </header>
    <div class="cart-scroll" id="cart-scroll">
      <div id="cart-list" class="cart-list"></div>
    </div>
    <div class="fade full" aria-hidden="true"></div>
    <button type="button" class="mic-fab" id="btn-mic-cart" aria-label="Speak an item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
    </button>
  </section>

  <!-- ===================== MANAGE SHOPS ===================== -->
  <section id="shops" class="screen" aria-label="Manage shops" hidden>
    <header class="shops-header">
      <button type="button" class="round-btn back" id="btn-back" aria-label="Back to lists">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="title-block">
        <p class="subtle" id="shop-count">0 shops</p>
        <h1>Manage shops</h1>
      </div>
      <span class="round-btn tile" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v1a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0V9z"/><path d="M5 13v7h14v-7"/><path d="M10 20v-4h4v4"/></svg>
      </span>
    </header>

    <div class="add-shop-wrap" id="add-shop-wrap">
      <button type="button" class="primary-btn" id="btn-add-shop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        Add shop
      </button>
    </div>

    <div class="shops-scroll">
      <form class="card shop-form" id="shop-form" hidden autocomplete="off">
        <h2 id="form-title">New shop</h2>
        <div class="form-row">
          <label for="shop-name">Shop name</label>
          <input id="shop-name" type="text" placeholder="e.g. Kroger" required>
        </div>
        <div class="form-row">
          <label for="shop-alias">Also listen for (optional)</label>
          <div class="with-mic">
            <input id="shop-alias" type="text" placeholder="e.g. kroger's, croger">
            <button type="button" class="square-mic" id="btn-alias-mic" aria-label="Say the shop name to add how the phone hears it">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
            </button>
          </div>
          <span class="hint" id="alias-hint">Tap the mic and say the shop name. Whatever the phone hears is added here.</span>
        </div>
        <div class="form-row">
          <span class="label">Color</span>
          <div class="swatches" id="swatches" role="group" aria-label="Color"></div>
        </div>
        <div class="form-buttons">
          <button type="button" class="ghost-btn" id="btn-form-cancel">Cancel</button>
          <button type="submit" class="primary-btn small" id="btn-form-save">Save shop</button>
        </div>
        <button type="button" class="danger-link" id="btn-form-delete" hidden>Delete this shop</button>
      </form>

      <h2 class="section-label">Your shops</h2>
      <ul class="card shop-list" id="shop-list"></ul>
    </div>
  </section>

  <!-- ===================== LISTENING SHEET ===================== -->
  <div class="sheet-backdrop" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-top">
        <span class="status" id="sheet-title"><span class="dot" aria-hidden="true"></span><span id="sheet-status">Listening…</span></span>
        <button type="button" class="round-btn dark" id="btn-sheet-close" aria-label="Cancel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="said-row">
        <p class="said-label">You said</p>
        <button type="button" class="edit-said" id="btn-edit-said" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>
          Edit
        </button>
      </div>
      <div class="said" id="sheet-transcript">…</div>
      <div class="bars" id="sheet-bars" aria-hidden="true"></div>

      <form class="type-instead" id="type-form" hidden autocomplete="off">
        <label for="type-input" class="sr-only">Type what you would say</label>
        <input id="type-input" type="text" placeholder="e.g. buy milk and eggs from Costco" enterkeyhint="done">
        <button type="submit" class="primary-btn small">Go</button>
      </form>

      <div class="result card" id="sheet-result" hidden></div>

      <div class="sheet-actions" id="sheet-actions">
        <button type="button" class="link-btn" id="btn-type-instead">Type instead</button>
        <button type="button" class="ghost-btn light" id="btn-stop">Done speaking</button>
      </div>
    </div>
  </div>

  <!-- ===================== EDIT ITEM ===================== -->
  <div class="sheet-backdrop light" id="edit-sheet" hidden>
    <form class="edit-card" id="edit-form" role="dialog" aria-modal="true" aria-labelledby="edit-title" autocomplete="off">
      <h2 id="edit-title">Edit item</h2>
      <div class="form-row">
        <label for="edit-text">Item</label>
        <input id="edit-text" type="text" required enterkeyhint="done">
      </div>
      <div class="form-row">
        <label for="edit-shop">Shop</label>
        <select id="edit-shop"></select>
      </div>
      <div class="form-buttons">
        <button type="button" class="ghost-btn" id="edit-cancel">Cancel</button>
        <button type="submit" class="primary-btn small">Save</button>
      </div>
      <button type="button" class="danger-link" id="edit-delete">Delete item</button>
    </form>
  </div>

  <div class="toast" id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button type="button" id="toast-undo" hidden>Undo</button>
  </div>
</div>

<script type="module" src="js/app.js?v=9"></script>
</body>
</html>
